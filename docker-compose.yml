services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  aggregator:
    image: ghcr.io/mrkgrandjean/aggregator:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /root/.docker &&
        auth=$$(printf '%s:%s' "$$GHCR_USERNAME" "$$GHCR_TOKEN" | base64 | tr -d '\n') &&
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$$auth" > /root/.docker/config.json &&
        exec /usr/bin/ofelia daemon --docker
    environment:
      HOME: /root
      GHCR_USERNAME: ${GHCR_USERNAME}
      GHCR_TOKEN: ${GHCR_TOKEN}
    depends_on:
      - aggregator
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.enabled: "true"
      ofelia.job-run.dead-mans-switch.schedule: "@daily"
      ofelia.job-run.dead-mans-switch.image: "metric-stack-dead-mans-switch"
      ofelia.job-run.dead-mans-switch.network: "metric-stack"
      ofelia.job-run.dead-mans-switch.environment: >-
        ["POSTGRES_HOST=postgres", "POSTGRES_DB=${POSTGRES_DB}",
        "POSTGRES_USER=${POSTGRES_USER}", "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}",
        "NTFY_TOPIC=${NTFY_TOPIC}", "NTFY_URL=${NTFY_URL}",
        "DEAD_MANS_SWITCH_GRACE_MINUTES=${DEAD_MANS_SWITCH_GRACE_MINUTES:-30}"]
      ofelia.job-run.xbox-time-collector.schedule: "@every 1m"
      ofelia.job-run.xbox-time-collector.image: "ghcr.io/mrkgrandjean/xbox-time:latest"
      ofelia.job-run.xbox-time-collector.network: "metric-stack"
      ofelia.job-run.xbox-time-collector.environment: >-
        ["AGGREGATOR_URL=http://aggregator:8000", "OPENXBL_API_KEY=${OPENXBL_API_KEY}",
        "XBOX_TIME_XUID=${XBOX_TIME_XUID:-}"]
      ofelia.job-run.completed-tasks-collector.schedule: "@every 1m"
      ofelia.job-run.completed-tasks-collector.image: "ghcr.io/mrkgrandjean/completed-tasks:latest"
      ofelia.job-run.completed-tasks-collector.network: "metric-stack"
      ofelia.job-run.completed-tasks-collector.environment: >-
        ["AGGREGATOR_URL=http://aggregator:8000", "TODOIST_API_TOKEN=${TODOIST_API_TOKEN}"]

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards/grafana/provisioning:/etc/grafana/provisioning

  # dead-mans-switch:
  #   build:
  #     context: ./scripts
  #     dockerfile: dead_mans_switch.Dockerfile
  #   depends_on:
  #     - postgres
  #   environment:
  #     POSTGRES_HOST: postgres
  #     POSTGRES_DB: ${POSTGRES_DB}
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     NTFY_TOPIC: ${NTFY_TOPIC}
  #     NTFY_URL: ${NTFY_URL}
  #     DEAD_MANS_SWITCH_GRACE_MINUTES: ${DEAD_MANS_SWITCH_GRACE_MINUTES:-30}

  # xbox-time-collector:
  #   image: ghcr.io/mrkgrandjean/xbox-time:latest
  #   pull_policy: always
  #   environment:
  #     - AGGREGATOR_URL=http://aggregator:8000
  #     - OPENXBL_API_KEY=${OPENXBL_API_KEY}
  #     - XBOX_TIME_XUID=${XBOX_TIME_XUID:-}

networks:
  default:
    name: metric-stack

volumes:
  postgres-data:
  grafana-data:
